# Magma Minds Academy — full stack (MongoDB + Express API + Next.js + nginx)
#
#   1. cp .env.production.example .env      # then edit the secrets/domains
#   2. docker compose build
#   3. docker compose up -d
#   4. docker compose exec backend node src/seeders/runSeeder.js --superadmin
#
# Only nginx publishes ports (80/443). Everything else stays on the internal network.

name: magma-minds-academy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7
    container_name: mm-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok'",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    logging: *default-logging
    networks: [academy]

  backend:
    build:
      context: ./backend
    image: magma-minds/academy-api:latest
    container_name: mm-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "5000"
      UPLOAD_DIR: /app/uploads
      # nginx terminates TLS and forwards X-Forwarded-* headers
      TRUST_PROXY: "1"
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/academy?authSource=admin
    volumes:
      # Uploaded images/files survive redeploys (used when Cloudinary is not configured)
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks: [academy]

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the Next.js build: the API rewrite target + canonical site URL
        BACKEND_URL: http://backend:5000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    image: magma-minds/academy-web:latest
    container_name: mm-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:5000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks: [academy]

  nginx:
    image: nginx:1.27-alpine
    container_name: mm-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_started
    logging: *default-logging
    networks: [academy]

  # Optional helper for Let's Encrypt (used by deploy/scripts/enable-tls.sh).
  # Not started by a normal `docker compose up`.
  certbot:
    image: certbot/certbot:latest
    profiles: ["tls"]
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: ["certbot"]
    networks: [academy]

volumes:
  mongo-data:
  uploads-data:
  certbot-webroot:
  certbot-certs:

networks:
  academy:
    driver: bridge
