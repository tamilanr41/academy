# Active HTTP entry point (default deploys run over HTTP / plain IP).
# TLS options:
#   deploy/scripts/gen-self-signed.sh [ip-or-host]   -> HTTPS with a self-signed cert
#   deploy/scripts/enable-tls.sh <domain> [email]    -> HTTPS with Let's Encrypt
# Both scripts replace this file with a TLS server block.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  server_tokens off;
  client_max_body_size 6m; # keep >= MAX_UPLOAD_SIZE (5 MB) so admin uploads pass

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Let's Encrypt HTTP-01 challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
